<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hypha Canvas</title><style>
:root{color:#d9f1df;background:#07140f;font:14px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#174531,#07140f 50%)}main{max-width:1500px;margin:auto;padding:20px}header{display:flex;align-items:baseline;gap:14px}h1{font-size:22px;letter-spacing:.06em;margin:0}header p,.hint{color:#91b89f;margin:0}.toolbar{display:flex;gap:8px;margin:17px 0;flex-wrap:wrap}button{color:#d9f1df;background:#0d2a1d;border:1px solid #397454;border-radius:99px;padding:7px 12px;cursor:pointer}button.active,button:hover{background:#28714c;border-color:#a0f3bd}.hint{margin-left:auto;font-size:12px}.board{height:700px;display:grid;grid-template-columns:minmax(0,1fr) 280px;border:1px solid #356b50;border-radius:16px;overflow:hidden;background:#06110c;box-shadow:0 18px 60px #0008}.canvas-wrap{overflow:hidden}.canvas-wrap.dragging canvas{cursor:grabbing}canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}aside{padding:17px;border-left:1px solid #356b50;background:#0a1d14;overflow:auto}aside h2{font-size:15px}aside p{color:#9bbca6;line-height:1.5}dt{margin-top:12px;color:#80ae90;font-size:11px;text-transform:uppercase}dd{margin:4px 0;word-break:break-word}@media(max-width:800px){main{padding:12px}.board{grid-template-columns:1fr;height:720px}aside{border-left:0;border-top:1px solid #356b50;max-height:220px}}
</style><main><header><h1>Hypha · Mycelial Canvas</h1><p>拖拽节点 · 空白平移 · 滚轮缩放 · 点击查看关系</p></header><div class="toolbar"><button data-mode="all">全部关系</button><button data-mode="tasks">任务 DAG</button><button data-mode="knowledge">知识关系</button><button id="reset">适配视图</button><span class="hint">根系：依赖 · 紫色菌丝：双链 · 橙色支脉：affects</span></div><section class="board"><div class="canvas-wrap" id="canvas-wrap"><canvas id="graph" aria-label="Hypha 可交互菌丝关系图"></canvas></div><aside id="detail"><h2>节点详情</h2><p>选择一个菌落，查看任务、知识和相邻关系。</p></aside></section></main><script id="hypha-data" type="application/json">{{HYPHA_DATA}}</script><script>
const DATA=JSON.parse(document.querySelector('#hypha-data').textContent),canvas=document.querySelector('#graph'),ctx=canvas.getContext('2d'),wrap=document.querySelector('#canvas-wrap'),detail=document.querySelector('#detail'),nodes=[...Object.entries(DATA.tasks).map(([id,n])=>({id,type:'task',...n})),...Object.entries(DATA.knowledge).map(([id,n])=>({id,type:'knowledge',...n}))],pos=new Map(),camera={x:0,y:0,s:1};let mode=DATA.initialMode||'all',selected,drag;const shown=()=>nodes.filter(n=>mode==='all'||n.type===(mode==='tasks'?'task':'knowledge')),edge=e=>mode==='all'||mode==='tasks'&&['parent','depends'].includes(e.kind)||mode==='knowledge'&&e.kind==='wiki';function layout(){let a=shown(),c=Math.max(1,Math.ceil(Math.sqrt(a.length)));a.forEach((n,i)=>{if(!pos.has(n.id)||pos.get(n.id).m!==mode)pos.set(n.id,{x:130+i%c*230,y:110+Math.floor(i/c)*145,m:mode})})}function sp(p){return{x:p.x*camera.s+camera.x,y:p.y*camera.s+camera.y}}function wp(p){return{x:(p.x-camera.x)/camera.s,y:(p.y-camera.y)/camera.s}}function color(k){return k==='wiki'?'#bd8cff':k==='affects'?'#f5a34d':k==='depends'?'#55dba0':'#75a98c'}function draw(){let r=wrap.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#06110c';ctx.fillRect(0,0,r.width,r.height);layout();let ids=new Set(shown().map(n=>n.id));for(let e of DATA.edges.filter(e=>edge(e)&&ids.has(e.from)&&ids.has(e.to))){let a=sp(pos.get(e.from)),b=sp(pos.get(e.to));ctx.strokeStyle=color(e.kind);ctx.globalAlpha=selected?.35:.75;ctx.lineWidth=e.kind==='affects'?2.5:1.4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo((a.x+b.x)/2,(a.y+b.y)/2-20,b.x,b.y);ctx.stroke()}ctx.globalAlpha=1;for(let n of shown()){let p=sp(pos.get(n.id)),w=164*camera.s,h=62*camera.s;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=n.type==='task'?'#123d2b':'#2a1b49';ctx.strokeStyle=n.id===selected?'#f1fff4':n.type==='task'?'#55dba0':'#bd8cff';ctx.lineWidth=n.id===selected?3:1.5;ctx.beginPath();n.type==='task'?ctx.roundRect(-w/2,-h/2,w,h,14):ctx.arc(0,0,Math.min(w,h)/2,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#edfff2';ctx.font=`${12*camera.s}px system-ui`;ctx.fillText((n.id+' · '+n.title).slice(0,22),-w/2+10*camera.s,-4*camera.s);ctx.fillStyle='#9fcbb0';ctx.font=`${10*camera.s}px system-ui`;ctx.fillText(n.status||n.claim_kind||'note',-w/2+10*camera.s,17*camera.s);ctx.restore()}}function hit(p){p=wp(p);return shown().reverse().find(n=>{let q=pos.get(n.id);return Math.abs(p.x-q.x)<82&&Math.abs(p.y-q.y)<31})}function select(n){selected=n?.id;if(!n)detail.innerHTML='<h2>节点详情</h2><p>选择一个菌落，查看任务、知识和相邻关系。</p>';else{let links=DATA.edges.filter(e=>e.from===n.id||e.to===n.id).map(e=>`${e.kind}: ${e.from===n.id?e.to:e.from}`);detail.innerHTML=`<h2>${n.title}</h2><dl><dt>ID</dt><dd>${n.id}</dd><dt>类型</dt><dd>${n.type==='task'?'任务':'知识'}</dd><dt>状态</dt><dd>${n.status||n.claim_kind||'—'}</dd><dt>关系</dt><dd>${links.join('<br>')||'无直接关系'}</dd></dl>`}draw()}function resize(){let r=wrap.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}canvas.addEventListener('pointerdown',e=>{let p={x:e.offsetX,y:e.offsetY},n=hit(p);canvas.setPointerCapture(e.pointerId);drag={p,n,o:n?{...pos.get(n.id)}:{x:camera.x,y:camera.y}};wrap.classList.add('dragging')});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.offsetX-drag.p.x,dy=e.offsetY-drag.p.y;if(drag.n){let q=pos.get(drag.n.id);q.x=drag.o.x+dx/camera.s;q.y=drag.o.y+dy/camera.s}else{camera.x=drag.o.x+dx;camera.y=drag.o.y+dy}draw()});canvas.addEventListener('pointerup',e=>{if(Math.hypot(e.offsetX-drag.p.x,e.offsetY-drag.p.y)<4)select(drag.n);drag=null;wrap.classList.remove('dragging')});canvas.addEventListener('wheel',e=>{e.preventDefault();let p=wp({x:e.offsetX,y:e.offsetY});camera.s=Math.max(.35,Math.min(2.4,camera.s*(e.deltaY<0?1.12:.89)));camera.x=e.offsetX-p.x*camera.s;camera.y=e.offsetY-p.y*camera.s;draw()},{passive:false});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected=null;camera.x=camera.y=0;camera.s=1;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));draw()});document.querySelector('#reset').onclick=()=>{camera.x=camera.y=0;camera.s=1;draw()};document.querySelector(`[data-mode="${mode}"]`).classList.add('active');new ResizeObserver(resize).observe(wrap);resize();
</script></html>
