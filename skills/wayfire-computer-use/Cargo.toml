[package]
name = "wayfire-computer-use"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.102"
ashpd = { version = "=0.11.1", default-features = false, features = ["tokio"] }
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.183"
pipewire = "=0.9.2"
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "time", "sync", "process"] }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.9.0"
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }
